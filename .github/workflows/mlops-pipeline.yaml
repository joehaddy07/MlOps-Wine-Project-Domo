# ==========================================================
# Workflow Name
#
# This workflow demonstrates a complete MLOps CI/CD pipeline.
#
# Pipeline Flow
#
# Developer Push
#       │
#       ▼
# Checkout Source Code
#       │
#       ▼
# Install Python Dependencies
#       │
#       ▼
# Run Unit Tests
#       │
#       ▼
# Train Machine Learning Model
#       │
#       ▼
# Log Metrics to MLflow
#       │
#       ▼
# Register Model
#       │
#       ▼
# Build Docker Image
#       │
#       ▼
# Push Docker Image to Docker Hub
#       │
#       ▼
# Load Image into Kind Cluster
#       │
#       ▼
# Deploy with Helm
#       │
#       ▼
# Verify Kubernetes Deployment
# ==========================================================

name: MLOps Wine CI/CD Pipeline

# ==========================================================
# Trigger
#
# Execute the workflow whenever code is pushed to main.
# ==========================================================

on:
  push:
    branches:
      - main

# ==========================================================
# Environment Variables
#
# Central location for reusable values.
# ==========================================================

env:
  PYTHON_VERSION: "3.12"

  IMAGE_NAME: wine-streamlit-app

  IMAGE_TAG: latest

  HELM_RELEASE: wine-app

  HELM_CHART: ./helm/wine

# ==========================================================
# Jobs
#
# The workflow contains two jobs.
#
# Job 1
#   Build, Test, Train, Build Docker Image
#
# Job 2
#   Deploy to Kubernetes
# ==========================================================

jobs:

############################################################
#
# JOB 1
#
# Build • Test • Train • Docker
#
############################################################

  build-train:

    runs-on: self-hosted

    steps:

############################################################
# Step 1
# Checkout Repository
############################################################

      - name: Checkout Source Code
        uses: actions/checkout@v4

############################################################
# Step 2
# Install Python
############################################################

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: ${{ env.PYTHON_VERSION }}

############################################################
# Step 3
# Install Dependencies
############################################################

      - name: Install Python Dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

############################################################
# Step 4
# Run Unit Tests
############################################################

      - name: Run Unit Tests

        run: |

          pytest

############################################################
# Step 5
# Train Machine Learning Model
############################################################

      - name: Train Machine Learning Model

        run: |

          python src/main.py

############################################################
# Step 6
# Log Experiment to MLflow
#
# train.py should already contain:
#
# mlflow.start_run()
# mlflow.log_param()
# mlflow.log_metric()
# mlflow.log_artifact()
# mlflow.sklearn.log_model()
#
############################################################

      - name: Log Metrics to MLflow

        run: |

          echo "Training information logged to MLflow."

############################################################
# Step 7
# Register Model
#
# Example:
#
# models:/wine-model/Production
#
############################################################

      - name: Register Model

        run: |

          echo "Register model in MLflow Registry."

############################################################
# Step 8
# Login to Docker Hub
############################################################

      - name: Login to Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}

############################################################
# Step 9
# Build Docker Image
############################################################

      - name: Build Docker Image

        run: |

          docker build \
          -f app/Dockerfile \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

############################################################
# Step 10
# Push Docker Image
############################################################

      - name: Push Docker Image

        run: |

          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

############################################################
#
# JOB 2
#
# Kubernetes Deployment
#
############################################################

  deploy:

    needs: build-train

    runs-on: self-hosted

    steps:

############################################################
# Step 11
# Checkout Repository
############################################################

      - name: Checkout Repository

        uses: actions/checkout@v4

############################################################
# Step 12
# Verify Environment
############################################################

      - name: Verify Environment

        run: |

          echo "Docker"

          docker version

          echo "Kind"

          kind get clusters

          echo "kubectl"

          kubectl get nodes

          echo "Helm"

          helm version

############################################################
# Step 13
# Load Docker Image into Kind
#
# This makes the locally-built image available to the
# Kubernetes nodes inside the Kind cluster.
############################################################

      - name: Load Image into Kind

        run: |

          kind load docker-image \
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

############################################################
# Step 14
# Deploy with Helm
#
# If the release exists:
#     Upgrade
#
# Otherwise:
#     Install
############################################################

      - name: Deploy Application with Helm

        run: |

          helm upgrade --install \
          ${{ env.HELM_RELEASE }} \
          ${{ env.HELM_CHART }}

############################################################
# Step 15
# Wait for Kubernetes Deployment
############################################################

      - name: Wait for Deployment

        run: |

          kubectl rollout status deployment/wine-app --timeout=180s

############################################################
# Step 16
# Verify Kubernetes Deployment
############################################################

      - name: Verify Kubernetes Resources

        run: |

          echo "Pods"

          kubectl get pods -o wide

          echo "Services"

          kubectl get svc

          echo "Deployments"

          kubectl get deployments

          echo "Describe Deployment"

          kubectl describe deployment wine-app

############################################################
# Step 17
# Pipeline Completed
############################################################

      - name: Pipeline Completed Successfully

        run: |

          echo "Application deployed successfully."