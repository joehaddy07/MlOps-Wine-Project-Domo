# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow
#
# Developer Push
#       │
#       ▼
# Checkout Source Code
#       │
#       ▼
# Install Python
#       │
#       ▼
# Install Dependencies
#       │
#       ▼
# Run Unit Tests
#       │
#       ▼
# Train Machine Learning Model
#       │
#       ▼
# Log Experiment Information
#       │
#       ▼
# Login to Docker Hub
#       │
#       ▼
# Build Docker Image
#       │
#       ▼
# Push Docker Image to Docker Hub
#       │
#       ▼
# Verify joe-cluster
#       │
#       ▼
# Configure kubectl
#       │
#       ▼
# Load Docker Image into joe-cluster
#       │
#       ▼
# Deploy with Helm
#       │
#       ▼
# Wait for Deployment
#       │
#       ▼
# Verify Kubernetes Resources
# ==========================================================

name: MLOps Wine CI/CD Pipeline


# ==========================================================
# TRIGGER
#
# Run the workflow whenever code is pushed to main.
# ==========================================================

on:

  push:

    branches:
      - main


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:

  # Python version used by the pipeline
  PYTHON_VERSION: "3.12"

  # Docker image name
  IMAGE_NAME: wine-streamlit-app

  # Docker image tag
  IMAGE_TAG: latest

  # Helm release name
  HELM_RELEASE: wine-app

  # Helm chart location
  HELM_CHART: ./helm/wine

  # IMPORTANT:
  # This is the Kind cluster we are maintaining.
  KIND_CLUSTER: joe-cluster


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # JOB 1
  #
  # Build
  # Test
  # Train
  # Docker
  #
  # ========================================================

  build-train:

    runs-on: self-hosted


    steps:


      # ======================================================
      # STEP 1
      # Checkout Repository
      # ======================================================

      - name: Checkout Source Code

        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # Setup Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: ${{ env.PYTHON_VERSION }}


      # ======================================================
      # STEP 3
      # Install Python Dependencies
      # ======================================================

      - name: Install Python Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ======================================================
      # STEP 4
      # Run Unit Tests
      # ======================================================

      - name: Run Unit Tests

        run: |

          pytest


      # ======================================================
      # STEP 5
      # Train Machine Learning Model
      #
      # main.py is the entry point for the ML pipeline.
      # ======================================================

      - name: Train Machine Learning Model

        run: |

          python src/main.py


      # ======================================================
      # STEP 6
      # Log Experiment Information
      #
      # The actual MLflow logging should happen inside
      # the Python training code.
      # ======================================================

      - name: Log Metrics to MLflow

        run: |

          echo "Training information logged to MLflow."


      # ======================================================
      # STEP 7
      # Register Model
      #
      # This is currently a placeholder.
      #
      # Actual MLflow Model Registry registration can
      # be added after the basic pipeline is working.
      # ======================================================

      - name: Register Model

        run: |

          echo "Register model in MLflow Registry."


      # ======================================================
      # STEP 8
      # Login to Docker Hub
      # ======================================================

      - name: Login to Docker Hub

        uses: docker/login-action@v3

        with:

          username: ${{ secrets.DOCKERHUB_USERNAME }}

          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ======================================================
      # STEP 9
      # Build Docker Image
      #
      # Dockerfile is located inside:
      #
      # app/Dockerfile
      #
      # The build context remains the project root.
      # ======================================================

      - name: Build Docker Image

        run: |

          docker build \
            -f app/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .


      # ======================================================
      # STEP 10
      # Push Docker Image to Docker Hub
      # ======================================================

      - name: Push Docker Image

        run: |

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ========================================================
  # JOB 2
  #
  # Kubernetes Deployment
  #
  # IMPORTANT:
  #
  # We are NOT creating another Kind cluster.
  #
  # We are using:
  #
  #     joe-cluster
  #
  # ========================================================

  deploy:

    needs: build-train

    runs-on: self-hosted


    steps:


      # ======================================================
      # STEP 11
      # Checkout Repository
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # STEP 12
      # Verify Docker
      # ======================================================

      - name: Verify Docker

        run: |

          echo "======================================"

          echo "Docker Version"

          echo "======================================"

          docker version


      # ======================================================
      # STEP 13
      # Verify Kind Installation
      # ======================================================

      - name: Verify Kind

        run: |

          echo "======================================"

          echo "Kind Version"

          echo "======================================"

          kind version

          echo ""

          echo "======================================"

          echo "Available Kind Clusters"

          echo "======================================"

          kind get clusters


      # ======================================================
      # STEP 14
      # Verify joe-cluster
      #
      # This is the important section.
      #
      # We explicitly check that joe-cluster exists.
      # ======================================================

      - name: Verify joe-cluster

        run: |

          echo "======================================"

          echo "Checking joe-cluster"

          echo "======================================"

          kind get clusters

          echo ""

          echo "Checking for joe-cluster..."

          kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"


      # ======================================================
      # STEP 15
      # Configure kubectl
      #
      # Export the kubeconfig for joe-cluster.
      #
      # Kind creates the context:
      #
      # kind-joe-cluster
      # ======================================================

      - name: Configure kubectl for joe-cluster

        run: |

          echo "Exporting kubeconfig..."

          kind export kubeconfig \
            --name ${{ env.KIND_CLUSTER }}


          echo ""

          echo "Current Kubernetes Context:"

          kubectl config current-context


          echo ""

          echo "Switching to joe-cluster..."

          kubectl config use-context \
            kind-${{ env.KIND_CLUSTER }}


      # ======================================================
      # STEP 16
      # Verify Kubernetes Cluster
      #
      # This confirms that joe-cluster's Kubernetes API
      # server is accessible.
      # ======================================================

      - name: Verify Kubernetes Cluster

        run: |

          echo "======================================"

          echo "Kubernetes Context"

          echo "======================================"

          kubectl config current-context


          echo ""

          echo "======================================"

          echo "Kubernetes Nodes"

          echo "======================================"

          kubectl get nodes -o wide


          echo ""

          echo "======================================"

          echo "Cluster Information"

          echo "======================================"

          kubectl cluster-info


      # ======================================================
      # STEP 17
      # Load Docker Image into joe-cluster
      #
      # This loads the Docker image directly into the
      # Kind node.
      #
      # Kubernetes can then use the local image without
      # pulling it again from Docker Hub.
      # ======================================================

      - name: Load Image into joe-cluster

        run: |

          echo "Loading Docker image into joe-cluster..."

          kind load docker-image \
            --name ${{ env.KIND_CLUSTER }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


      # ======================================================
      # STEP 18
      # Verify Docker Image
      #
      # Display the image that will be deployed.
      # ======================================================

      - name: Verify Docker Image

        run: |

          echo "Docker image:"

          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"


      # ======================================================
      # STEP 19
      # Verify Helm
      # ======================================================

      - name: Verify Helm

        run: |

          echo "======================================"

          echo "Helm Version"

          echo "======================================"

          helm version


      # ======================================================
      # STEP 20
      # Deploy Application with Helm
      #
      # If release doesn't exist:
      #
      #     helm install
      #
      # If release exists:
      #
      #     helm upgrade
      #
      # upgrade --install handles both cases.
      # ======================================================

      - name: Deploy Application with Helm

        run: |

          helm upgrade --install \
            ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }}


      # ======================================================
      # STEP 21
      # Wait for Kubernetes Deployment
      # ======================================================

      - name: Wait for Deployment

        run: |

          kubectl rollout status \
            deployment/wine-app \
            --timeout=180s


      # ======================================================
      # STEP 22
      # Verify Pods
      # ======================================================

      - name: Verify Pods

        run: |

          echo "======================================"

          echo "Pods"

          echo "======================================"

          kubectl get pods -o wide


      # ======================================================
      # STEP 23
      # Verify Services
      # ======================================================

      - name: Verify Services

        run: |

          echo "======================================"

          echo "Services"

          echo "======================================"

          kubectl get svc


      # ======================================================
      # STEP 24
      # Verify Deployments
      # ======================================================

      - name: Verify Deployments

        run: |

          echo "======================================"

          echo "Deployments"

          echo "======================================"

          kubectl get deployments


      # ======================================================
      # STEP 25
      # Describe Deployment
      # ======================================================

      - name: Describe Deployment

        run: |

          kubectl describe deployment wine-app


      # ======================================================
      # STEP 26
      # Pipeline Completed
      # ======================================================

      - name: Pipeline Completed Successfully

        run: |

          echo "======================================"

          echo "MLOps Pipeline Completed Successfully"

          echo "======================================"

          echo "Docker Image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"

          echo ""

          echo "Kind Cluster:"
          echo "${{ env.KIND_CLUSTER }}"

          echo ""

          echo "Helm Release:"
          echo "${{ env.HELM_RELEASE }}"