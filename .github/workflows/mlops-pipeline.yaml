# ==========================================================
# MLOps Wine CI/CD Pipeline
#
# Pipeline Flow
#
# Developer Push
#        │
#        ▼
# Checkout Source Code
#        │
#        ▼
# Install Python
#        │
#        ▼
# Install Dependencies
#        │
#        ▼
# Run Unit Tests
#        │
#        ▼
# Train Machine Learning Model
#        │
#        ▼
# Log Experiment + Register Model with MLflow
#        │
#        ▼
# Login to Docker Hub
#        │
#        ▼
# Configure Docker Daemon (Limit Concurrent Uploads)
#        │
#        ▼
# Build Docker Image
#        │
#        ▼
# Push Docker Image to Docker Hub
#        │
#        ▼
# Verify joe-cluster
#        │
#        ▼
# Configure kubectl
#        │
#        ▼
# Load Docker Image into joe-cluster
#        │
#        ▼
# Deploy with Helm
#        │
#        ▼
# Wait for Deployment
#        │
#        ▼
# Verify Kubernetes Resources
# ==========================================================

name: MLOps Wine CI/CD Pipeline


# ==========================================================
# TRIGGER
#
# Run the workflow whenever code is pushed to main.
# ==========================================================

on:
  push:
    branches:
      - main


# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================

env:
  # Python version
  PYTHON_VERSION: "3.12"

  # Docker image name
  IMAGE_NAME: wine-streamlit-app

  # Docker image tag
  IMAGE_TAG: latest

  # Helm release name
  HELM_RELEASE: wine-app

  # Helm chart location
  HELM_CHART: ./helm/wine

  # Kind cluster we are maintaining
  KIND_CLUSTER: joe-cluster


# ==========================================================
# JOBS
# ==========================================================

jobs:

  # ========================================================
  # JOB 1
  #
  # Build
  # Test
  # Train
  # MLflow
  # Docker
  # ========================================================

  build-train:
    runs-on: self-hosted

    steps:

      # ======================================================
      # STEP 1
      # Checkout Repository
      # ======================================================

      - name: Checkout Source Code
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # Setup Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}


      # ======================================================
      # STEP 3
      # Install Python Dependencies
      # ======================================================

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt


      # ======================================================
      # STEP 4
      # Run Unit Tests
      # ======================================================

      - name: Run Unit Tests
        run: |
          pytest


      # ======================================================
      # STEP 5
      # Train Model + MLflow
      # ======================================================

      - name: Train and Track Model with MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          echo "======================================"
          echo "Training Machine Learning Model"
          echo "======================================"
          echo ""
          echo "MLflow Tracking Server:"
          echo "${MLFLOW_TRACKING_URI}"
          echo ""
          python -m src.main


      # ======================================================
      # STEP 6
      # Verify MLflow Execution
      # ======================================================

      - name: Verify MLflow Execution
        run: |
          echo "======================================"
          echo "MLflow Training Completed"
          echo "======================================"
          echo "The MLflow experiment and model registration"
          echo "are handled by src/main.py."


      # ======================================================
      # STEP 7
      # Login to Docker Hub
      # ======================================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ======================================================
      # STEP 7.1
      # Configure Docker Daemon Limits (Prevents Push Loop Retries)
      # ======================================================

      - name: Limit Docker Concurrent Uploads
        run: |
          echo "======================================"
          echo "Configuring Docker Daemon Limits"
          echo "======================================"
          sudo mkdir -p /etc/docker
          echo '{"max-concurrent-uploads": 3}' | sudo tee /etc/docker/daemon.json
          sudo systemctl reload docker || true


      # ======================================================
      # STEP 8
      # Build Docker Image
      # ======================================================

      - name: Build Docker Image
        run: |
          docker build \
            -f app/Dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .


      # ======================================================
      # STEP 9
      # Push Docker Image
      # ======================================================

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # ========================================================
  # JOB 2
  #
  # Kubernetes Deployment
  # ========================================================

  deploy:
    needs: build-train
    runs-on: self-hosted

    steps:

      # ======================================================
      # STEP 10
      # Checkout Repository
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 11
      # Verify Docker
      # ======================================================

      - name: Verify Docker
        run: |
          echo "======================================"
          echo "Docker Version"
          echo "======================================"
          docker version


      # ======================================================
      # STEP 12
      # Verify Kind
      # ======================================================

      - name: Verify Kind
        run: |
          echo "======================================"
          echo "Kind Version"
          echo "======================================"
          kind version
          echo ""
          echo "======================================"
          echo "Available Kind Clusters"
          echo "======================================"
          kind get clusters


      # ======================================================
      # STEP 13
      # Verify joe-cluster
      # ======================================================

      - name: Verify joe-cluster
        run: |
          echo "======================================"
          echo "Checking joe-cluster"
          echo "======================================"
          kind get clusters
          echo ""
          echo "Checking for joe-cluster..."
          kind get clusters | grep -x "${{ env.KIND_CLUSTER }}"
          echo ""
          echo "joe-cluster exists."


      # ======================================================
      # STEP 14
      # Configure kubectl
      # ======================================================

      - name: Configure kubectl for joe-cluster
        run: |
          echo "======================================"
          echo "Configuring kubectl"
          echo "======================================"
          kind export kubeconfig \
            --name ${{ env.KIND_CLUSTER }}
          echo ""
          echo "Current Kubernetes Context:"
          kubectl config current-context
          echo ""
          echo "Switching to joe-cluster..."
          kubectl config use-context \
            kind-${{ env.KIND_CLUSTER }}


      # ======================================================
      # STEP 15
      # Verify Kubernetes Cluster
      # ======================================================

      - name: Verify Kubernetes Cluster
        run: |
          echo "======================================"
          echo "Kubernetes Context"
          echo "======================================"
          kubectl config current-context
          echo ""
          echo "======================================"
          echo "Kubernetes Nodes"
          echo "======================================"
          kubectl get nodes -o wide
          echo ""
          echo "======================================"
          echo "Cluster Information"
          echo "======================================"
          kubectl cluster-info


      # ======================================================
      # STEP 16
      # Load Docker Image into joe-cluster
      # ======================================================

      - name: Load Image into joe-cluster
        run: |
          echo "======================================"
          echo "Loading Docker Image"
          echo "======================================"
          kind load docker-image \
            --name ${{ env.KIND_CLUSTER }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


      # ======================================================
      # STEP 17
      # Verify Docker Image
      # ======================================================

      - name: Verify Docker Image
        run: |
          echo "======================================"
          echo "Docker Image"
          echo "======================================"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"


      # ======================================================
      # STEP 18
      # Verify Helm
      # ======================================================

      - name: Verify Helm
        run: |
          echo "======================================"
          echo "Helm Version"
          echo "======================================"
          helm version


      # ======================================================
      # STEP 19
      # Deploy Application with Helm
      # ======================================================

      - name: Deploy Application with Helm
        run: |
          helm upgrade --install \
            ${{ env.HELM_RELEASE }} \
            ${{ env.HELM_CHART }} \
            --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ env.IMAGE_TAG }}


      # ======================================================
      # STEP 20
      # Wait for Kubernetes Deployment
      # ======================================================

      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/wine-app \
            --timeout=180s


      # ======================================================
      # STEP 21
      # Verify Pods
      # ======================================================

      - name: Verify Pods
        run: |
          echo "======================================"
          echo "Pods"
          echo "======================================"
          kubectl get pods -o wide


      # ======================================================
      # STEP 22
      # Verify Services
      # ======================================================

      - name: Verify Services
        run: |
          echo "======================================"
          echo "Services"
          echo "======================================"
          kubectl get svc


      # ======================================================
      # STEP 23
      # Verify Deployments
      # ======================================================

      - name: Verify Deployments
        run: |
          echo "======================================"
          echo "Deployments"
          echo "======================================"
          kubectl get deployments


      # ======================================================
      # STEP 24
      # Describe Deployment
      # ======================================================

      - name: Describe Deployment
        run: |
          kubectl describe deployment wine-app


      # ======================================================
      # STEP 25
      # Final Verification
      # ======================================================

      - name: Final Kubernetes Verification
        run: |
          echo "======================================"
          echo "FINAL KUBERNETES VERIFICATION"
          echo "======================================"
          echo ""
          echo "Cluster:"
          echo "${{ env.KIND_CLUSTER }}"
          echo ""
          echo "Context:"
          kubectl config current-context
          echo ""
          echo "Nodes:"
          kubectl get nodes
          echo ""
          echo "Pods:"
          kubectl get pods
          echo ""
          echo "Services:"
          kubectl get svc
          echo ""
          echo "Deployments:"
          kubectl get deployments


      # ======================================================
      # STEP 26
      # Pipeline Completed
      # ======================================================

      - name: Pipeline Completed Successfully
        run: |
          echo "======================================"
          echo "MLOps Pipeline Completed Successfully"
          echo "======================================"
          echo ""
          echo "Docker Image:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo ""
          echo "Kind Cluster:"
          echo "${{ env.KIND_CLUSTER }}"
          echo ""
          echo "Helm Release:"
          echo "${{ env.HELM_RELEASE }}"
          echo ""
          echo "Kubernetes Context:"
          kubectl config current-context