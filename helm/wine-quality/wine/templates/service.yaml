apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.app.name }}
  labels:
    app: {{ .Values.app.name }}

spec:
  selector:
    app: {{ .Values.app.name }}

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}

  # To access the service externally, you can use the following command to get the NodePort:
  #kubectl port-forward service/wine-app 8501:80