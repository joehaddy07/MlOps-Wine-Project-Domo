replicaCount: 3

app:
  name: wine-app

image:
  repository: joehaddy/wine-streamlit-app
  tag: "latest"
  pullPolicy: IfNotPresent

container:
  name: wine-container
  port: 8501

service:
  type: NodePort
  port: 80
  targetPort: 8501

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

probes:
  readiness:
    path: /_stcore/health
    port: 8501
    initialDelaySeconds: 25
    periodSeconds: 10
    failureThreshold: 6
  liveness:
    path: /_stcore/health
    port: 8501
    initialDelaySeconds: 30
    periodSeconds: 15